[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noddle-mcp"
version = "1.0.0"
description = "MCP server (stdio) for noddle draw boards — stdlib-only, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://draw.noddle.dev"
Source = "https://github.com/noddle-dev/noddle-draw"

[project.scripts]
noddle-mcp = "noddle_mcp:main"

[tool.setuptools]
py-modules = ["noddle_mcp"]
