# Release the stdio MCP server: PyPI package first, then the official MCP
# Registry entry (mcp/server.json). Runs only on a tag `mcp-v<version>`.
#
# No stored secrets:
#   - PyPI uses Trusted Publishing (OIDC). One-time setup on pypi.org: add a
#     trusted publisher for project `noddle-draw-mcp`, owner `noddle-dev`,
#     repository `noddle-draw`, workflow `mcp-publish.yml`, environment `pypi`.
#   - The MCP Registry uses `mcp-publisher login github-oidc`, which grants the
#     `io.github.noddle-dev/*` namespace to workflows in this org's repos.
name: Publish MCP server

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

concurrency:
  group: mcp-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag and versions agree
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          python3 - "$tag" <<'PY'
          import json, re, sys, tomllib
          tag = sys.argv[1]
          src = open("mcp/noddle_mcp.py", encoding="utf-8").read()
          code = re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1)
          proj = tomllib.load(open("mcp/pyproject.toml", "rb"))["project"]["version"]
          sj = json.load(open("mcp/server.json", encoding="utf-8"))
          pkg = [p["version"] for p in sj["packages"] if p["identifier"] == "noddle-draw-mcp"]
          found = {"tag": tag, "__version__": code, "pyproject": proj,
                   "server.json": sj["version"], "server.json package": pkg[0] if pkg else None}
          print(found)
          # The package version is the code version. server.json equals the tag and is
          # either the package version or a metadata-only suffix of it (1.0.0-1).
          ok = (code == proj == found["server.json package"]
                and sj["version"] == tag
                and (tag == code or re.fullmatch(re.escape(code) + r"-\d+", tag)))
          if not ok:
              sys.exit(f"version mismatch: {found}")
          if "<!-- mcp-name: " + sj["name"] + " -->" not in open("mcp/README.md", encoding="utf-8").read():
              sys.exit("mcp/README.md lacks the mcp-name marker for " + sj["name"])
          PY
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          python -m pip install --quiet pytest
          python -m pytest mcp -q

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build twine
          python -m build mcp --outdir dist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A metadata-only registry release (tag 1.0.0-1) reuses an existing
      # package; skip the upload when PyPI already has this version.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  registry:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for PyPI to serve the release
        run: |
          v=$(python3 -c "import json;print([p['version'] for p in json.load(open('mcp/server.json'))['packages']][0])")
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/noddle-draw-mcp/$v/json" >/dev/null; then
              echo "PyPI has noddle-draw-mcp $v"; exit 0
            fi
            sleep 10
          done
          echo "PyPI never served noddle-draw-mcp $v" >&2; exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate mcp/server.json

      - name: Log in (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish mcp/server.json
